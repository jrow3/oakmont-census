name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test

      - name: Fetch census data into site/data.json
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: node scripts/fetch-census.mjs

      # Runs against the data just fetched, not a fixture: it checks every chart's parts still add
      # up to the universe printed beside them. A new ACS vintage that reshapes a table fails here
      # rather than shipping a page that contradicts itself.
      - name: Reconcile the built payload
        run: node scripts/reconcile.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
