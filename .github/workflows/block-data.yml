name: Block data (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch 2020 decennial block populations
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          node -e '(async()=>{const out=[];for(const tract of ["151601","151602"]){const url=`https://api.census.gov/data/2020/dec/pl?get=P1_001N,NAME&for=block:*&in=state:06+county:097+tract:${tract}&key=${process.env.CENSUS_API_KEY}`;const res=await fetch(url);const text=await res.text();let json;try{json=JSON.parse(text)}catch(e){console.error("NON-JSON",text.slice(0,140));process.exit(1)}const h=json[0];const iPop=h.indexOf("P1_001N"),iState=h.indexOf("state"),iCounty=h.indexOf("county"),iTract=h.indexOf("tract"),iBlock=h.indexOf("block");for(const row of json.slice(1)){const geoid=row[iState]+row[iCounty]+row[iTract]+row[iBlock];out.push({geoid,tract,block:row[iBlock],pop:parseInt(row[iPop],10)})}}console.log("<<<BLOCKS>>>"+JSON.stringify(out)+"<<<END>>>")})()'
